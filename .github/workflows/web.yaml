---
name: Deploy Website

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment,
# skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want
# to allow these production deployments to complete.
concurrency:
  group: "deploy"
  cancel-in-progress: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-web:
    name: Deploy website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          # Need full history + all tags so we can diff against the previous release tag
          fetch-depth: 0

      - name: Resolve previous release tag
        id: prev_tag
        run: |
          set -euo pipefail
          CURRENT="${GITHUB_REF_NAME}"
          # Newest version tags excluding the tag that triggered this run
          PREV="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vxF "${CURRENT}" | head -n1 || true)"
          echo "previous=${PREV}" >> "${GITHUB_OUTPUT}"
          echo "Current tag: ${CURRENT}"
          echo "Previous tag: ${PREV:-<none>}"

      - uses: dorny/paths-filter@v4.0.1
        id: changes
        # Only diff when we have a previous tag to compare against
        if: steps.prev_tag.outputs.previous != ''
        with:
          base: ${{ steps.prev_tag.outputs.previous }}
          ref: ${{ github.sha }}
          filters: |
            web:
              - '.github/workflows/web.yaml'
              - 'web/**'
              - 'ws.schema.json'
              - 'ws-global.schema.json'

      - name: Decide whether to deploy
        id: should_deploy
        run: |
          set -euo pipefail
          # Deploy on: manual run, first release (no previous tag), or web/schema changes since previous tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
             || -z "${{ steps.prev_tag.outputs.previous }}" \
             || "${{ steps.changes.outputs.web }}" == "true" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            echo "Deploying website"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping deploy (no web/schema changes since ${{ steps.prev_tag.outputs.previous }})"
          fi

      - if: steps.should_deploy.outputs.deploy == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
      - if: steps.should_deploy.outputs.deploy == 'true'
        name: Cache Vite-Plus dependencies
        uses: actions/cache@v5.0.4
        with:
          path: ~/.vite-plus
          key: web-vite-plus-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            web-vite-plus-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.should_deploy.outputs.deploy == 'true'
        name: Install dependencies
        run: vp install
      - if: steps.should_deploy.outputs.deploy == 'true'
        name: Add schema files to website
        run: |
          cp ws.schema.json web/static/ws.schema.json
          cp ws-global.schema.json web/static/ws-global.schema.json
      - if: steps.should_deploy.outputs.deploy == 'true'
        name: Install dependencies
        run: cd web && vp install
      - if: steps.should_deploy.outputs.deploy == 'true'
        name: Create Website
        run: cd web && vp run build
      - if: steps.should_deploy.outputs.deploy == 'true'
        name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - if: steps.should_deploy.outputs.deploy == 'true'
        name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: "web/build"
      - if: steps.should_deploy.outputs.deploy == 'true'
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
