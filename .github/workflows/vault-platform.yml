name: Vault platform

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.3.0
        with:
          go-version: "1.25.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build desktop and portal
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @withsecrets/desktop build
          pnpm --filter @withsecrets/portal build
      - name: Test
        run: go test ./...
